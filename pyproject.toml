[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hyclb"
version = "0.3.0"
description = "Common Lisp compiled to Python, with SBCL as the macroexpander"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Hirotaka Niitsuma", email = "hirotaka.niitsuma@gmail.com" }]
keywords = ["common-lisp", "lisp", "macros", "compiler", "hy", "sbcl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Lisp",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Compilers",
]
dependencies = ["hy>=1.3"]

[project.optional-dependencies]
# (declare (optimize (speed 3))) compiles through Numba when it is available
fast = ["numba"]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/niitsuma/hycl"
Repository = "https://github.com/niitsuma/hycl"

[tool.setuptools]
packages = ["hyclb"]

[tool.setuptools.package-data]
# the expander runs bridge.lisp; the special operators live in cl.hy
hyclb = ["*.lisp", "*.hy"]

[tool.pytest.ini_options]
markers = ["slow: translates a whole standard-library module"]
